{% extends 'base.html' %}
{% block content %}
<div class="card-hotel" style="max-width: 450px; margin: 40px auto; padding: 35px; background: white; text-align: center; border-top: 4px solid var(--hotel-gold); box-shadow: 0 5px 15px rgba(0,0,0,0.05);">
    <h2 style="font-weight: 300; text-transform: uppercase; margin-bottom: 25px; border-bottom: 2px solid var(--hotel-gold); padding-bottom: 10px;">
        🔑 Авторизация в системе
    </h2>
    
    <form method="post">
        {% csrf_token %}
        
        {% if form.errors %}
            <div style="color: #dc3545; margin-bottom: 15px; font-size: 0.85rem; background: #fdf2f2; padding: 10px; border: 1px solid #f5c2c2;">
                ⚠️ Неверное имя пользователя или пароль. Пожалуйста, попробуйте еще раз.
            </div>
        {% endif %}
        
        <div style="text-align: left; margin-bottom: 15px;">
            <label style="display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.85rem; color: #555;">Имя пользователя (Логин):</label>
            <input type="text" name="username" required style="padding: 10px; width: 100%; border: 1px solid #ccc; font-size: 0.9rem;">
        </div>
        
        <div style="text-align: left; margin-bottom: 25px;">
            <label style="display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.85rem; color: #555;">Пароль:</label>
            <input type="password" name="password" required style="padding: 10px; width: 100%; border: 1px solid #ccc; font-size: 0.9rem;">
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
            <button type="submit" class="btn-search" style="padding: 12px; background: #b89447; color: white; border: none; cursor: pointer; font-weight: 600; text-transform: uppercase; width: 100%; font-size: 0.9rem; justify-content: center; display: block;">
                Войти в аккаунт
            </button>
            <a href="/" style="padding: 10px; border: 1px solid #1a1a1a; color: #1a1a1a; text-decoration: none; text-transform: uppercase; font-size: 0.8rem; font-weight: 600; display: block; text-align: center;">
                Вернуться назад
            </a>
        </div>
    </form>
</div>
{% endblock %}
